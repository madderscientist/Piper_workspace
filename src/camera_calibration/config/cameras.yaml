# PiPER-X 腕部相机配置：仅 arm_3 (192.168.123.97) 和 arm_4 (192.168.123.98) 装有腕部相机。
# 外参参考点统一定义为夹爪底座 Mesh（gripper_base.STL / gripper_base_without_flange.STL）的最高点中心 gripper_base_top：
#   - gripper_base.STL（含 10.5 mm 底法兰）：最高点在自身 Z = +63.0 mm (0.063 m)
#   - gripper_base_without_flange.STL（去掉 10.5 mm 底法兰）：最高点在自身 Z = +52.5 mm (0.0525 m)
# 两个 Mesh 的最高点对应夹爪外壳上同一个物理顶面中心（X=0, Y=0），相机即安装在该 Mesh 上。

cameras:
  camera_arm_3:
    arm: arm_3
    arm_namespace: /arm_3
    ip: 192.168.123.97
    label: 机械臂 3 腕部相机
    topic: /camera_arm_3/image_raw
    info_topic: /camera_arm_3/camera_info
    frame: camera_arm_3
    parent_frame: gripper_base_top
    base_frame: base_link
    link6_to_top_z_m: 0.0928
    gripper_variant: gripper_with_wrench
    role: target
    mount_parent: gripper_base_top
    mount_joint: arm_3_camera_optical_joint
    mount_create: true
    joint_states_topic: /arm_3/joint_states_feedback
    aliases: [arm_3_camera, arm3_camera, camera_arm3, camera_3, cam3, arm_3, arm3, 192.168.123.97]
    switch:
      kind: camera_node
      node: /camera_arm_3
    profiles:
      - {width: 720, height: 480, url: 'rtsp://admin:123456@192.168.123.97/stream1'}
      - {width: 1920, height: 1080, url: 'rtsp://admin:123456@192.168.123.97/stream0'}

  camera_arm_4:
    arm: arm_4
    arm_namespace: /arm_4
    ip: 192.168.123.98
    label: 机械臂 4 腕部相机
    topic: /camera_arm_4/image_raw
    info_topic: /camera_arm_4/camera_info
    frame: camera_arm_4
    parent_frame: gripper_base_top
    base_frame: base_link
    link6_to_top_z_m: 0.0928
    gripper_variant: gripper_with_wrench
    role: target
    mount_parent: gripper_base_top
    mount_joint: arm_4_camera_optical_joint
    mount_create: true
    joint_states_topic: /arm_4/joint_states_feedback
    aliases: [arm_4_camera, arm4_camera, camera_arm4, camera_4, cam4, arm_4, arm4, 192.168.123.98]
    switch:
      kind: camera_node
      node: /camera_arm_4
    profiles:
      - {width: 720, height: 480, url: 'rtsp://admin:123456@192.168.123.98/stream1'}
      - {width: 1920, height: 1080, url: 'rtsp://admin:123456@192.168.123.98/stream0'}

# 外参阶段拍照前的静止判据：所选机械臂六轴速度均低于阈值并持续 settle_seconds 才放行。
motion_gate:
  max_joint_speed: 0.1      # rad/s
  settle_seconds: 0.5
