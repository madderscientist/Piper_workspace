<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiPER-X 头部相机</title>
  <style>
    :root { color-scheme: dark; --bg: #0c1220; --card: #151f30; --line: #29374c; --muted: #99abc1; --accent: #88bdff; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: #edf3fc; }
    main { max-width: 1600px; margin: auto; padding: 22px; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
    h1 { margin: 0 0 2px; font-size: 23px; }
    h2 { font-size: 15px; margin: 0; }
    p { margin: 0; color: var(--muted); }
    .top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .tabs { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 4px; }
    .tab { background: transparent; color: var(--muted); border: 0; padding: 7px 14px; border-radius: 7px; font-weight: 600; cursor: pointer; }
    .tab.active { background: #243652; color: #fff; }
    .badge { border: 1px solid var(--line); border-radius: 24px; padding: 6px 13px; white-space: nowrap; font-size: 13px; }
    .badge.live { color: #83e8bb; border-color: #326f60; }
    .badge.error { color: #ffb2b2; border-color: #884f55; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 18px; align-items: start; }
    .calib-layout { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .card-head { display: flex; justify-content: space-between; align-items: center; padding: 13px 18px; gap: 12px; border-bottom: 1px solid var(--line); }
    .card-head span { color: var(--muted); font-size: 13px; }
    .viewport { height: clamp(260px, 38vw, 620px); background: #060b14; position: relative; display: grid; place-items: center; }
    .viewport img { width: 100%; height: 100%; object-fit: contain; position: absolute; }
    .placeholder { text-align: center; padding: 24px; color: var(--muted); max-width: 92%; overflow-wrap: anywhere; }
    .note { border-top: 1px solid var(--line); padding: 10px 18px; font-size: 12.5px; color: var(--muted); }
    code { color: #c4dcfc; font: 12.5px/1.5 ui-monospace, monospace; }
    .pad { padding: 16px 18px; }
    .form-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: var(--muted); }
    input, select { width: 100%; margin-top: 3px; padding: 7px 8px; border-radius: 7px; border: 1px solid var(--line); background: #0d1524; color: #edf3fc; font: inherit; }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    button { font: inherit; font-weight: 600; padding: 8px 15px; border-radius: 8px; border: 1px solid var(--line); background: #1e2d44; color: #edf3fc; cursor: pointer; }
    button.primary { background: var(--accent); color: #0a1b31; border-color: var(--accent); }
    button.danger { background: #3e2430; color: #ffc2c2; border-color: #6c3c4b; }
    button:disabled { opacity: .38; cursor: not-allowed; }
    .stats { display: flex; flex-wrap: wrap; gap: 22px; margin: 12px 0; }
    .stat-label { display: block; color: var(--muted); font-size: 12px; }
    .stat-value { font-size: 19px; font-variant-numeric: tabular-nums; font-weight: 600; }
    .shots { max-height: 210px; overflow: auto; border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
    .shot-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #1e2b3e; font-size: 13px; }
    .shot-row button { padding: 2px 8px; font-size: 12px; }
    .calib-box { background: #0d1524; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-top: 10px; font-size: 13px; }
    #error { margin-top: 14px; color: #ffd1d1; background: #3b202a; border: 1px solid #71404e; padding: 11px 15px; border-radius: 9px; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
    @media (max-width: 980px) { .calib-layout, .grid { grid-template-columns: 1fr; } .form-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>PiPER-X · 头部相机</h1><p>多相机硬件序列号绑定 · 低延迟 HTTP MJPG · ChArUco 内参标定</p></div>
    <div class="top-right">
      <div class="tabs" role="tablist">
        <button id="tab-live" class="tab active" type="button">实时画面</button>
        <button id="tab-calib" class="tab" type="button">内参标定</button>
      </div>
      <div id="connection" class="badge" role="status">正在连接</div>
    </div>
  </header>
  <section id="live-grid" class="grid"></section>
  <section id="calib-section" class="calib-layout" hidden>
    <article class="card">
      <div class="card-head"><h2>实时角点检测预览</h2><span id="calib-cam-spec">—</span></div>
      <div class="viewport">
        <img id="calib-image" alt="标定角点检测画面" hidden>
        <div id="calib-placeholder" class="placeholder">等待相机画面</div>
      </div>
      <div class="note">每个相机的内参按其 12 位硬件序列号独立存储在 <code>config/intrinsic.yaml</code></div>
    </article>
    <article class="card">
      <div class="card-head"><h2>ChArUco 内参标定</h2><span id="calib-serial">—</span></div>
      <div class="pad">
        <label style="margin-bottom:10px">选择目标相机<select id="calib-cam-select"></select></label>
        <div class="form-grid">
          <label>格数 X<input id="bx" type="number" min="3" value="12"></label>
          <label>格数 Y<input id="by" type="number" min="3" value="9"></label>
          <label>方格 mm<input id="bsq" type="number" step="0.01" value="15"></label>
          <label>Marker mm<input id="bmk" type="number" step="0.01" value="11.25"></label>
          <label>字典<input id="bdict" type="text" value="DICT_5X5_100"></label>
        </div>
        <div class="buttons">
          <button id="btn-board" type="button">应用板规格</button>
          <button id="btn-shot" class="primary" type="button">＋ 采集当前帧</button>
          <button id="btn-solve" class="primary" type="button">求解并保存内参</button>
          <button id="btn-clear" class="danger" type="button">清空</button>
        </div>
        <div class="stats">
          <div><span class="stat-label">已采集视图</span><span id="shot-count" class="stat-value">0</span></div>
          <div><span class="stat-label">角点覆盖率</span><span id="shot-cov" class="stat-value">0%</span></div>
          <div><span class="stat-label">标定 RMS</span><span id="solved-rms" class="stat-value">—</span></div>
        </div>
        <div id="intrinsic-summary" class="calib-box">选择相机后手持标定板采集多角度图像求解内参。</div>
        <div style="margin-top:8px;font-size:12px;color:var(--muted)">内参文件：<code id="calib-file">—</code></div>
        <div id="shot-list" class="shots"></div>
      </div>
    </article>
  </section>
  <div id="error" role="alert" hidden></div>
</main>
<script>
  const el = id => document.getElementById(id);
  let mode = 'live', status = null, calib = null, activeCam = '', busy = false, cmdErr = '', boardSynced = false;
  function bindStream(img, ph, url, enabled) {
    if (!enabled) {
      if (img.dataset.stream) { img.dataset.stream = ''; img.removeAttribute('src'); }
      img.hidden = true; ph.hidden = false;
      return;
    }
    if (img.dataset.stream === url) return;
    img.dataset.stream = url;
    img.onload = () => { img.hidden = false; ph.hidden = true; };
    img.onerror = () => { img.dataset.stream = ''; img.hidden = true; ph.hidden = false; };
    img.src = url;
  }
  function ensureLiveCards(cams) {
    const sig = cams.map(c => c.name).join(',');
    const host = el('live-grid');
    if (host.dataset.sig === sig) return;
    host.dataset.sig = sig;
    host.innerHTML = cams.map((c, idx) => `
      <article class="card" data-cam="${c.name}">
        <div class="card-head"><h2>${c.name}${c.serial ? ` · <code>${c.serial}</code>` : ''}</h2><span class="spec">—</span></div>
        <div class="viewport">
          <img class="live-img" alt="${c.name}" hidden>
          <div class="placeholder">等待相机画面</div>
        </div>
        <div class="note">快照：<code>/frame/color.jpg?camera=${c.name}</code> · 流：<code>/stream/color.mjpg?camera=${c.name}</code> · 内参：<code>/api/intrinsic?camera=${c.name}</code></div>
      </article>`).join('');
    const sel = el('calib-cam-select');
    sel.innerHTML = cams.map(c => `<option value="${c.name}">${c.name}${c.serial ? ` (serial=${c.serial})` : ''}</option>`).join('');
    if (!activeCam && cams.length) activeCam = cams[0].name;
    sel.value = activeCam;
  }
  function renderCalib() {
    if (!calib) return;
    if (!boardSynced && calib.board) {
      el('bx').value = calib.board.squares_x;
      el('by').value = calib.board.squares_y;
      el('bsq').value = +(calib.board.square_size * 1000).toFixed(4);
      el('bmk').value = +(calib.board.marker_size * 1000).toFixed(4);
      el('bdict').value = calib.board.dictionary;
      boardSynced = true;
    }
    el('calib-serial').textContent = `标识键: ${calib.camera_key}`;
    el('calib-file').textContent = calib.calib_file || '—';
    const shots = calib.shots || [];
    el('shot-count').textContent = shots.length;
    el('shot-cov').textContent = `${(calib.total_coverage * 100).toFixed(1)}%`;
    const sv = calib.saved;
    el('solved-rms').textContent = sv && sv.available ? `${sv.rms.toFixed(3)} px` : '—';
    if (sv && sv.available) {
      const k = sv.camera_matrix;
      el('intrinsic-summary').innerHTML = `<strong>已保存 [${calib.camera_key}] ${sv.width}×${sv.height} 内参</strong>（RMS ${sv.rms.toFixed(4)} px，${sv.images} 张，FOV ${sv.fov_deg[0]}°×${sv.fov_deg[1]}°）<br>` +
        `<code>fx=${k[0].toFixed(2)}, fy=${k[4].toFixed(2)}, cx=${k[2].toFixed(2)}, cy=${k[5].toFixed(2)}</code><br>` +
        `<code>dist=[${sv.distortion_coefficients.map(v => v.toFixed(5)).join(', ')}]</code>`;
    } else {
      el('intrinsic-summary').textContent = '该相机当前分辨率尚未标定内参。手持标定板覆盖中心与四角采集至少 4 张（建议 8~15 张）后点击「求解并保存内参」。';
    }
    el('shot-list').innerHTML = shots.map(s =>
      `<div class="shot-row"><span><code>${s.name}</code> · 角点 ${s.corners} · 覆盖 ${(s.coverage * 100).toFixed(1)}%` +
      (s.error_px >= 0 ? ` · 误差 ${s.error_px.toFixed(3)} px` : '') +
      `</span><button type="button" data-del="${s.name}">删除</button></div>`).join('');
    el('shot-list').querySelectorAll('[data-del]').forEach(btn => {
      btn.onclick = () => apiPost(`/api/calib/delete?camera=${encodeURIComponent(activeCam)}`, {name: btn.dataset.del});
    });
  }
  function render() {
    if (!status) return;
    const cams = status.cameras && status.cameras.length ? status.cameras : [status];
    ensureLiveCards(cams);
    const readyCount = cams.filter(c => c.camera_ready).length;
    el('connection').textContent = `在线相机 ${readyCount} / ${cams.length}`;
    el('connection').className = 'badge' + (readyCount === cams.length ? ' live' : ' error');
    const inCalib = (mode === 'calib');
    el('live-grid').hidden = inCalib;
    el('calib-section').hidden = !inCalib;
    for (const c of cams) {
      const card = el('live-grid').querySelector(`[data-cam="${c.name}"]`);
      if (!card) continue;
      const calibTag = c.intrinsic_available ? `已标定(${c.intrinsic_rms.toFixed(2)}px)` : '未标定';
      card.querySelector('.spec').textContent = `${c.video_device || ''} · ${c.width}×${c.height} @ ${c.fps}fps · ${calibTag}`;
      const ph = card.querySelector('.placeholder');
      ph.textContent = c.camera_error || '等待相机画面';
      bindStream(card.querySelector('.live-img'), ph, `/stream/color.mjpg?camera=${encodeURIComponent(c.name)}`, !inCalib && c.camera_ready && c.color_enabled);
    }
    const cur = cams.find(c => c.name === activeCam) || cams[0];
    if (cur) {
      el('calib-cam-spec').textContent = `${cur.name} · ${cur.width}×${cur.height} @ ${cur.fps}fps`;
      el('calib-placeholder').textContent = cur.camera_error || '等待相机画面';
      bindStream(el('calib-image'), el('calib-placeholder'), `/stream/calib.mjpg?camera=${encodeURIComponent(cur.name)}`, inCalib && cur.camera_ready);
      el('btn-shot').disabled = busy || !cur.camera_ready;
    }
    el('btn-solve').disabled = busy || !calib || (calib.shots || []).length < 4;
    el('btn-board').disabled = busy;
    el('btn-clear').disabled = busy;
    el('error').textContent = cmdErr;
    el('error').hidden = !cmdErr;
  }
  async function loadCalib() {
    if (!activeCam) return;
    const r = await fetch(`/api/calib?camera=${encodeURIComponent(activeCam)}`, {cache: 'no-store'});
    if (r.ok) { calib = await r.json(); renderCalib(); render(); }
  }
  async function apiPost(url, payload) {
    busy = true; cmdErr = ''; render();
    try {
      const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload || {})});
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
      if (url.startsWith('/api/calib/')) { calib = d; renderCalib(); }
    } catch (e) { cmdErr = e.message; }
    busy = false; render();
  }
  el('tab-live').onclick = () => { mode = 'live'; cmdErr = ''; el('tab-live').classList.add('active'); el('tab-calib').classList.remove('active'); render(); };
  el('tab-calib').onclick = () => { mode = 'calib'; cmdErr = ''; el('tab-calib').classList.add('active'); el('tab-live').classList.remove('active'); loadCalib(); render(); };
  el('calib-cam-select').onchange = e => { activeCam = e.target.value; calib = null; loadCalib(); render(); };
  el('btn-board').onclick = () => { boardSynced = false; apiPost(`/api/calib/board?camera=${encodeURIComponent(activeCam)}`, {squares_x: +el('bx').value, squares_y: +el('by').value, square_size_mm: +el('bsq').value, marker_size_mm: +el('bmk').value, dictionary: el('bdict').value}); };
  el('btn-shot').onclick = () => apiPost(`/api/calib/capture?camera=${encodeURIComponent(activeCam)}`, {});
  el('btn-solve').onclick = () => apiPost(`/api/calib/solve?camera=${encodeURIComponent(activeCam)}`, {});
  el('btn-clear').onclick = () => apiPost(`/api/calib/clear?camera=${encodeURIComponent(activeCam)}`, {});
  (async () => {
    while (true) {
      try {
        const r = await fetch('/api/status', {cache: 'no-store'});
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        status = await r.json();
        if (mode === 'calib' && !calib && activeCam) await loadCalib();
        render();
      } catch (e) {
        el('connection').textContent = '服务中断'; el('connection').className = 'badge error';
        el('error').hidden = false; el('error').textContent = e.message;
        status = null;
      }
      await new Promise(res => setTimeout(res, 500));
    }
  })();
</script>
</body>
</html>
