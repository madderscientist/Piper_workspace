# 头部相机默认运行参数与 ChArUco 标定板尺寸（进 git）。
# 本机接入的相机列表（serial -> 名称及标定文件路径）放在 $PIPER_CONFIG_DIR/head_camera/<name>.yaml，模板见 config/examples/head_camera/。
device: 0
video_device: ""
depth_mode: WFOV_2X2BINNED
fps: 30
color: "OFF"
output: head_camera_data
count: 1
interval: 0.0
duration: 0.0
preview: false

board:
  squares_x: 12
  squares_y: 9
  square_size: 0.015
  marker_size: 0.01125
  dictionary: DICT_5X5_100
